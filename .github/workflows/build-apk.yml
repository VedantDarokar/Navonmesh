name: Build Navonmesh Coordinator APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Client Dependencies
        run: |
          cd Hackthon/client
          npm install --legacy-peer-deps

      - name: Build Web Production Assets
        env:
          VITE_API_URL: https://navonmesh2026.onrender.com
        run: |
          cd Hackthon/client
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd Hackthon/client
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd Hackthon/client/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Navonmesh Coordinator APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Navonmesh-Coordinator-APK
          path: Hackthon/client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
